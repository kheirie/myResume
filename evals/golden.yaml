- question: "What was Kheirie's personal contribution to the summarization project at Sanofi, and what were the model results?"
  answerable: true
  expected_sources:
    - exp-sanofi#extractive-summarization-of-medicine-and-drug-documents
    - exp-sanofi#text-preprocessing-and-report-generation-pipelines
  notes: >-
    Tricky case: separate individual contribution from the team's wider scope.
    Expected: Kheirie was part of a team fine-tuning and evaluating BERT-based
    models for extractive summarization of detailed medicine and drug documents.
    The overall project covered Word and PDF files; Kheirie worked on the Word
    documents. Kheirie also contributed to the team's preprocessing and
    post-processing pipelines using SpaCy and regular expressions, producing
    JSON summaries and Word reports. The models achieved ROUGE-1 of 47% and
    ROUGE-2 of 25%. Do not assign PDF work or sole project ownership to Kheirie,
    describe the task as abstractive summarization, or relabel ROUGE as accuracy.

- question: "Can you give an example of Kheirie using semantic search to solve a business problem?"
