    - edu-dsti#applied-msc-in-data-science-artificial-intelligence
  notes: >-
    Expected: the Junior Data Scientist role at QuantCube was an alternance
    (work-study arrangement) alongside the Applied MSc at DSTI. The role ran
    from October 2023 to October 2025; the studies ran from September 2023 to
    December 2025. Do not invent a weekly schedule, working hours, or describe
    the overlap as two unrelated full-time commitments.

- question: "What multilingual NLP work did Kheirie do on PMI nowcasting, and what results did it achieve?"
  answerable: true
  expected_sources:
    - exp-quantcube#pmi-nowcasting-with-arabic-and-english-sentiment-analysis
  notes: >-
    Tricky case: preserve the country-to-metric mapping and metric type.
    Expected: at QuantCube, Kheirie built Purchasing Managers' Index (PMI)
    nowcasting indicators for Egypt and Saudi Arabia. BERT-based sentiment
    analysis was applied to Arabic and English text; sentiment information
    was combined with numerical data. Correlation with the respective official
    PMI was 80% for Egypt and 88% for Saudi Arabia. Do not swap the results,
    call them accuracy, or say BERT sentiment analysis was applied to numerical
    data. The correlation method and evaluation period are not specified.

- question: "What did Kheirie build to estimate inflation in Saudi Arabia, and how was its performance reported?"
  answerable: true
  expected_sources:
    - exp-quantcube#consumer-price-index-estimation-for-saudi-arabia
  notes: >-
    Expected: at QuantCube, Kheirie designed and evaluated statistical and
    machine learning models to estimate Saudi Arabia's Consumer Price Index
    (CPI). The reported result was 98% correlation with the official benchmark.
    Preserve the distinction between estimating CPI and a specifically defined
    inflation-rate forecast; no forecast horizon is supplied. Do not describe
    the result as 98% accuracy or name model algorithms not in the source.

- question: "Has Kheirie built a RAG system, and was it deployed as a customer-facing production product?"
  answerable: true
  expected_sources:
