  expected_sources:
    - exp-braincities#job-matching-project-for-enel
  notes: >-
    Expected: at Braincities Lab, Kheirie was responsible for the job-matching
    component of a Workforce Mapping Solution for ENEL, matching jobs from
    ENEL's unorganized Excel database to standardized O*NET and ESCO jobs.
    Kheirie web-scraped job descriptions and examples with BeautifulSoup and
    fine-tuned the Sentence-BERT matching model. The system achieved 90%
    accuracy in matching ENEL's jobs to the relevant O*NET and ESCO jobs.
    Do not infer a production rollout, commercial impact, dataset size, or
    evaluation protocol that is not documented.
