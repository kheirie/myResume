# 43 answerable questions and 9 unanswerable questions (5 short pronoun and acronym questions added 2026-10-24).


- question: "How would you summarize Kheirie's professional background and main areas of expertise?"
  answerable: true
  expected_sources:
    - about#professional-summary
    - about#data-science-profile
    - exp-akureyri-curriculum#designing-masters-level-ai-courses
  notes: >-
    Expected: Kheirie is a data scientist specializing in NLP and generative AI,
    with over three years of experience in machine learning, NLP, and generative
    AI in finance and pharma. Relevant work includes statistical modeling and
    time series, Transformer fine-tuning, semantic search, and LLM systems using
    RAG and agents. Kheirie also designs master's-level AI curricula as a
    freelance AI Curriculum Developer for the University of Akureyri; the two
    courses are still in development. Do not describe them as already delivered,
    invent a seniority level, or inflate the stated duration of data science
    experience by adding education or curriculum-development periods.

- question: "What degrees does Kheirie hold, and which universities or institutes awarded them?"
  answerable: true
  expected_sources:
    - about#degrees
  notes: >-
    Expected: a BSc and an MSc in Computer and Communication Engineering from
    Rafic Hariri University in Lebanon; an MA by Research in Social Sciences
    from the University of Akureyri in Iceland; and an Applied MSc in Data
    Science and Artificial Intelligence from Data ScienceTech Institute (DSTI)
    in France. If dates are included: BSc September 2008-December 2011;
    engineering MSc January 2012-December 2013; MA September 2017-February 2019;
    DSTI MSc September 2023-December 2025. Do not turn the MA into an AI degree
    or claim a PhD.

- question: "How did Kheirie combine studying at DSTI with the role at QuantCube?"
  answerable: true
  expected_sources:
