[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumebot"
version = "0.1.0"
description = "A recruiter-facing chatbot that answers questions from approved background materials, with citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9,<1",
    "numpy>=2",
    "openai>=1.40",
    "pydantic>=2",
    "python-dotenv>=1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["gradio>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
